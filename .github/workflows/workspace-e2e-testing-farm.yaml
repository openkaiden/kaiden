name: workspace e2e tests (Testing Farm)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository to test (owner/repo); defaults to this repository'
        required: false
        type: string
      ref:
        description: 'Branch, tag, or SHA to test; defaults to the dispatch ref'
        required: false
        type: string

permissions:
  contents: read

jobs:
  workspace-e2e:
    name: Fedora 44 workspace provider E2E
    runs-on: ubuntu-24.04
    # Run only on the upstream repo: forks lack TEST_FARM_TOKEN and the
    # openkaiden/* allow-list means a fork dispatch could only test upstream
    # code anyway, so it could only fail.
    if: github.repository == 'openkaiden/kaiden'
    timeout-minutes: 240
    env:
      TESTING_FARM_COMPOSE: Fedora-44
    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve source repository and ref
        id: source
        env:
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_REF: ${{ inputs.ref }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          CURRENT_REF: ${{ github.ref_name }}
        run: .github/scripts/testing-farm/resolve-source.sh

      - name: Submit workspace provider tests to Testing Farm
        uses: sclorg/testing-farm-as-github-action@230555baceb860aa468d216f1822974836b965d1 # v4
        with:
          api_key: ${{ secrets.TEST_FARM_TOKEN }}
          git_url: https://github.com/${{ steps.source.outputs.repository }}.git
          git_ref: ${{ steps.source.outputs.sha }}
          tmt_plan_regex: workspace-provider
          tmt_path: tests/tmt
          compose: ${{ env.TESTING_FARM_COMPOSE }}
          arch: x86_64
          variables: KAIDEN_REPOSITORY=${{ steps.source.outputs.repository }};KAIDEN_REF=${{ steps.source.outputs.sha }}
          # Masked provider credentials; without them every scenario with a
          # requiredResource calls test.skip and the job reports a false green.
          secrets: ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }};OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }};GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }};MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}
          # The action polls for ~(timeout x 4) minutes: it runs timeout x 2
          # iterations 120s apart (see the pinned action source,
          # src/action.ts:205-233 at commit 230555b). 50 -> ~200m, kept under the
          # job timeout-minutes (240) so a result link is returned instead of
          # GitHub killing the job.
          timeout: 50
