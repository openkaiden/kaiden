name: workspace e2e tests (Testing Farm)
run-name: >-
  ${{ inputs.npm_target == 'test:e2e:workspaces:opencode' && 'workspace e2e tests (Testing Farm, opencode agent)'
    || inputs.npm_target == 'test:e2e:workspaces:goose' && 'workspace e2e tests (Testing Farm, goose agent)'
    || inputs.npm_target == 'test:e2e:workspaces:filesystem-network' && 'workspace e2e tests (Testing Farm, filesystem/network policies, opencode agent)'
    || 'workspace e2e tests (Testing Farm)' }}

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or full SHA of openkaiden/kaiden to test; defaults to the dispatch ref (leave empty with testing_build)'
        required: false
        type: string
      npm_target:
        default: 'test:e2e:workspaces'
        description: 'npm target to run tests (use :opencode, :goose or :filesystem-network for a single smoke test)'
        type: choice
        # Specs with scenarios that run here; Claude needs ANTHROPIC_API_KEY
        # (unavailable) and OpenClaw/Copilot are skipped for 0.4.0.
        options:
          - 'test:e2e:workspaces'
          - 'test:e2e:workspaces:opencode'
          - 'test:e2e:workspaces:goose'
          - 'test:e2e:workspaces:filesystem-network'
        required: false
      testing_build:
        description: 'openkaiden/testing-prereleases tag (e.g. v0.4.0-202611050813-f5fd986e6) to test its Linux x64 binary, with the specs from the commit it was built from'
        required: false
        type: string

permissions:
  contents: read

jobs:
  workspace-e2e:
    name: workspace provider e2e tests (Fedora 44, ${{ matrix.inference }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 'cloud-providers' runs the cloud-provider scenarios; 'ollama' runs only
        # the Ollama scenarios against a local Ollama server, kept apart because a
        # running local runtime changes the models the wizard offers.
        # filesystem-network has no Ollama scenario and goose's is skipped
        # (https://github.com/openkaiden/kaiden/issues/1780), so they run the
        # cloud-providers leg only. The whole matrix is one JSON value because a
        # static include entry would re-add the ollama leg for those targets.
        include: ${{ fromJSON(contains(fromJSON('["test:e2e:workspaces:filesystem-network","test:e2e:workspaces:goose"]'), inputs.npm_target) && '[{"inference":"cloud-providers"}]' || '[{"inference":"cloud-providers"},{"inference":"ollama","ollama_model":"granite3.2:2b"}]') }}
    # Run only on the upstream repo: forks lack TEST_FARM_TOKEN and the
    # openkaiden/* allow-list means a fork dispatch could only test upstream
    # code anyway, so it could only fail.
    if: github.repository == 'openkaiden/kaiden'
    timeout-minutes: 240
    env:
      TESTING_FARM_COMPOSE: Fedora-44
    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve testing build
        id: build
        if: ${{ inputs.testing_build != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TESTING_BUILD: ${{ inputs.testing_build }}
          INPUT_REF: ${{ inputs.ref }}
        run: .github/scripts/testing-farm/resolve-testing-build.sh

      - name: Resolve source repository and ref
        id: source
        env:
          INPUT_REF: ${{ inputs.ref || steps.build.outputs.sha }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          CURRENT_REF: ${{ github.ref_name }}
        run: .github/scripts/testing-farm/resolve-source.sh

      - name: Submit workspace provider tests to Testing Farm
        id: tf
        uses: sclorg/testing-farm-as-github-action@230555baceb860aa468d216f1822974836b965d1 # v4
        with:
          api_key: ${{ secrets.TEST_FARM_TOKEN }}
          git_url: https://github.com/${{ steps.source.outputs.repository }}.git
          # testing_build runs take the tmt plan and script from the workflow's
          # commit so older build commits can use them; other runs keep the
          # tested ref's own plan.
          git_ref: ${{ inputs.testing_build != '' && github.sha || steps.source.outputs.sha }}
          tmt_plan_regex: workspace-provider
          tmt_path: tests/tmt
          compose: ${{ env.TESTING_FARM_COMPOSE }}
          arch: x86_64
          # Scheduled runs have no inputs, so they keep running the full suite.
          variables: KAIDEN_REPOSITORY=${{ steps.source.outputs.repository }};KAIDEN_REF=${{ steps.source.outputs.sha }};KAIDEN_NPM_TARGET=${{ inputs.npm_target || 'test:e2e:workspaces' }}${{ steps.build.outputs.url && format(';KAIDEN_BUILD_URL={0};KAIDEN_BUILD_SHA256={1}', steps.build.outputs.url, steps.build.outputs.sha256) }}${{ matrix.ollama_model && format(';KAIDEN_OLLAMA_MODEL={0}', matrix.ollama_model) || '' }}
          # Covered providers only, and only to the leg that uses them; see
          # tests/tmt/scripts/workspace-provider.sh.
          secrets: ${{ matrix.inference == 'cloud-providers' && format('OPENAI_API_KEY={0};GEMINI_API_KEY={1}', secrets.OPENAI_API_KEY, secrets.GEMINI_API_KEY) || '' }}
          # The action polls for ~timeout x 4 minutes (~200m), between the test
          # duration (180m) and the job timeout (240m).
          timeout: 50

      # Public ranch artifacts are reachable from GitHub: fetch the sanitized
      # Playwright JUnit report and publish it to the job summary.
      - name: Download Playwright JUnit report from Testing Farm
        if: ${{ !cancelled() && steps.tf.outputs.test_log_url != '' }}
        env:
          TF_ARTIFACTS_URL: ${{ steps.tf.outputs.test_log_url }}
        run: .github/scripts/testing-farm/download-junit.sh

      - name: Publish test report
        if: ${{ !cancelled() && hashFiles('junit-playwright-results.xml') != '' }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6
        with:
          include_passed: true
          detailed_summary: true
          annotate_only: true
          require_tests: true
          report_paths: junit-playwright-results.xml
