name: workspace e2e tests (Testing Farm)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository to test (owner/repo); defaults to this repository'
        required: false
        type: string
      ref:
        description: 'Branch, tag, or SHA to test; defaults to the dispatch ref'
        required: false
        type: string

permissions:
  contents: read

jobs:
  workspace-e2e:
    name: Fedora 44 workspace provider E2E
    runs-on: ubuntu-24.04
    # Scheduled runs only on the upstream repo (forks lack TEST_FARM_TOKEN and
    # would fail nightly); manual dispatch stays available everywhere.
    if: github.event_name != 'schedule' || github.repository == 'openkaiden/kaiden'
    timeout-minutes: 240
    steps:
      - name: Resolve source repository and ref
        id: source
        env:
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_REF: ${{ inputs.ref }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          CURRENT_REF: ${{ github.ref_name }}
        run: |
          repository="${INPUT_REPOSITORY:-$CURRENT_REPOSITORY}"
          ref="${INPUT_REF:-$CURRENT_REF}"
          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Repository must use owner/repo format"
            exit 1
          fi
          # Provider secrets are exposed to the tmt plan/script of the repository
          # under test, so only allow repositories from the upstream org.
          if [[ "$repository" != openkaiden/* ]]; then
            echo "::error::Only openkaiden/* repositories may run this workflow"
            exit 1
          fi
          if [[ "$ref" =~ [[:space:]] || "$ref" == *";"* || "$ref" == -* ]]; then
            echo "::error::Ref must not contain whitespace, semicolons, or start with a dash"
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Testing $repository at $ref on Fedora 44"

      - name: Submit workspace provider tests to Testing Farm
        uses: sclorg/testing-farm-as-github-action@230555baceb860aa468d216f1822974836b965d1 # v4
        with:
          api_key: ${{ secrets.TEST_FARM_TOKEN }}
          git_url: https://github.com/${{ steps.source.outputs.repository }}.git
          git_ref: ${{ steps.source.outputs.ref }}
          tmt_plan_regex: workspace-provider
          tmt_path: tests/tmt
          compose: Fedora-44
          arch: x86_64
          variables: KAIDEN_REPOSITORY=${{ steps.source.outputs.repository }};KAIDEN_REF=${{ steps.source.outputs.ref }}
          # Masked provider credentials; without them every scenario with a
          # requiredResource calls test.skip and the job reports a false green.
          secrets: ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }};OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }};GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }};MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }};PODMANDESKTOP_CI_BOT_TOKEN=${{ secrets.GITHUB_TOKEN }}
          # The action polls for ~(timeout x 4) minutes (timeout x 2 iterations,
          # 120s each), so keep it well under the job timeout-minutes (240) to
          # return a Testing Farm result link instead of GitHub killing the job.
          timeout: 50
