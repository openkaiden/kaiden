---
version: 1

# Base sandbox policy shared by all agents.
#
# Defines non-composable sandbox restrictions: filesystem access,
# landlock, and process identity. Network access is provided
# entirely by provider profiles via provider-backed policy
# composition (ADR 0065).
#
# curl is deliberately excluded from all profile binary allowlists
# to prevent raw HTTP access with the injected GH_TOKEN.

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:

  # Required for Kaiden:
  # added to be able to download node-gyp releases for pnpm install
  nodegyp_releases:
    name: nodegyp-releases
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: /electron/node-gyp.git/git-upload-pack }
      - host: release-assets.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: /** }
      - host: codeload.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: /electron/node-gyp/** }
      - host: www.electronjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: /headers/** }
      - host: artifacts.electronjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: /** }
      - host: nodejs.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: /dist/** }
          # node-gyp >=10 fetches headers from /download/release/ by default
          - allow: { method: GET, path: /download/release/** }
    binaries:
      - path: "**/node"

  # proxy.spec.ts tests call fetch('https://podman-desktop.io') to exercise
  # the proxy subsystem — allow the sandbox to reach this domain.
  podman_desktop:
    name: podman-desktop
    endpoints:
      - host: podman-desktop.io
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: /** }
    binaries:
      - path: "**/node"

